<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Cyber Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Kolobok Gradients -->
    <radialGradient id="kolobokGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ff9800" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="kolobokBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="60%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <linearGradient id="visorNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 58px; font-weight: 900; letter-spacing: 2px; fill: #ffffff; }
    .brand-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="210" cy="210" r="160" fill="#f57c00" opacity="0.12" filter="url(#subtleGlow)"/>
  <circle cx="850" cy="180" r="220" fill="#3b82f6" opacity="0.08" filter="url(#subtleGlow)"/>

  <!-- Top Accent Cyber Stripe -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#lineGrad)"/>

  <!-- KOLOBOK MASCOT (Left Side) -->
  <g transform="translate(100, 100)">
    <!-- Aura -->
    <circle cx="110" cy="110" r="130" fill="url(#kolobokGlow)"/>
    
    <!-- Outer Shield Halo Ring -->
    <circle cx="110" cy="110" r="115" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
    <circle cx="110" cy="110" r="122" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="24 16" opacity="0.3"/>

    <!-- Head Body -->
    <circle cx="110" cy="110" r="92" fill="url(#kolobokBody)" stroke="#d97706" stroke-width="3"/>
    
    <!-- Light Specular Reflection -->
    <ellipse cx="80" cy="65" rx="36" ry="20" fill="#ffe082" opacity="0.45" transform="rotate(-25 80 65)"/>

    <!-- Cyber Visor / Glasses -->
    <rect x="52" y="94" width="116" height="34" rx="17" fill="url(#visorGrad)" stroke="#374151" stroke-width="2.5"/>
    
    <!-- Visor Neon Ray -->
    <rect x="62" y="106" width="96" height="10" rx="5" fill="url(#visorNeon)" filter="url(#neonFilter)"/>
    
    <!-- Blush -->
    <circle cx="56" cy="144" r="9" fill="#f97316" opacity="0.6"/>
    <circle cx="164" cy="144" r="9" fill="#f97316" opacity="0.6"/>

    <!-- Confident Tech Smile -->
    <path d="M 88 152 Q 110 168 132 152" fill="none" stroke="#9a3412" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- CONTENT (Right Side) -->
  <g transform="translate(370, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="21" class="badge-text" fill="#cbd5e1">OFFICIAL REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="brand-title">KOLOBOK <tspan fill="#f59e0b">VPN</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="206" class="brand-subtitle">Скоростной и безопасный клиент для Android &amp; Android TV</text>

    <!-- Platform Tags / Pills -->
    <g transform="translate(0, 245)">
      <!-- Android Mobile Pill -->
      <g>
        <rect width="230" height="44" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="20" y="27" class="badge-text" fill="#ffffff">📱 Android 8.0+ Mobile</text>
      </g>

      <!-- Android TV Pill -->
      <g transform="translate(245, 0)">
        <rect width="245" height="44" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="20" y="27" class="badge-text" fill="#ffffff">📺 Android TV &amp; Smart TV</text>
      </g>

      <!-- Telegram Bot Pill -->
      <g transform="translate(505, 0)">
        <rect width="220" height="44" rx="10" fill="#0369a1" opacity="0.9"/>
        <text x="18" y="27" class="badge-text" fill="#ffffff">✈️ @VpnKolobokBot</text>
      </g>
    </g>

    <!-- Technology Protocols Bottom Row -->
    <g transform="translate(0, 315)">
      <rect width="725" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Feature 1: Protocols -->
      <g transform="translate(20, 30)">
        <circle cx="0" cy="-6" r="4" fill="#38bdf8"/>
        <text x="12" y="-1" class="badge-text" fill="#94a3b8">Протоколы: <tspan fill="#38bdf8" font-weight="bold">AmneziaWG</tspan> &amp; <tspan fill="#38bdf8" font-weight="bold">VLESS Reality</tspan></text>
      </g>

      <!-- Divider -->
      <line x1="330" y1="12" x2="330" y2="36" stroke="#334155" stroke-width="1"/>

      <!-- Feature 2: TV QR Code Sync -->
      <g transform="translate(350, 30)">
        <circle cx="0" cy="-6" r="4" fill="#10b981"/>
        <text x="12" y="-1" class="badge-text" fill="#94a3b8">ТВ-привязка: <tspan fill="#34d399" font-weight="bold">QR-код без пульта (/tv)</tspan></text>
      </g>

      <!-- Divider -->
      <line x1="585" y1="12" x2="585" y2="36" stroke="#334155" stroke-width="1"/>

      <!-- Feature 3: No root -->
      <g transform="translate(605, 30)">
        <circle cx="0" cy="-6" r="4" fill="#f59e0b"/>
        <text x="12" y="-1" class="badge-text" fill="#fbbf24">No Root</text>
      </g>
    </g>
  </g>
</svg>
